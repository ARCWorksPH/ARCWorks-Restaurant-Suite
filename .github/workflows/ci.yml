name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet restore Roms.slnx
      - run: dotnet build Roms.slnx --no-restore --configuration Release
      - run: dotnet test Roms.slnx --no-build --configuration Release
      - run: docker build --tag roms:${{ github.sha }} .
