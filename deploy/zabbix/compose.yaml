name: arcworks-monitoring

services:
  postgres:
    image: postgres:16-alpine
    container_name: arcworks-monitoring-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: Asia/Manila
    secrets:
      - postgres_user
      - postgres_password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - backend
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/postgres_user)\" -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 2g

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0.29
    container_name: arcworks-monitoring-server
    restart: unless-stopped
    init: true
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: "5432"
      POSTGRES_DB: zabbix
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      ZBX_STARTPOLLERS: "10"
      ZBX_STARTHTTPPOLLERS: "5"
      ZBX_CACHESIZE: 128M
      ZBX_VALUECACHESIZE: 64M
      ZBX_HISTORYCACHESIZE: 64M
      ZBX_TRENDCACHESIZE: 32M
      ZBX_TIMEOUT: "10"
      ZBX_LOGSLOWQUERIES: "3000"
      TZ: Asia/Manila
    secrets:
      - postgres_user
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "10051:10051"
    networks:
      - backend
      - monitoring
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10051"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    mem_limit: 1536m

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0.29
    container_name: arcworks-monitoring-web
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: "10051"
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: "5432"
      POSTGRES_DB: zabbix
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PHP_TZ: Asia/Manila
      ZBX_SERVER_NAME: ARCWorks Monitoring
    secrets:
      - postgres_user
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_healthy
    ports:
      - "8085:8080"
    networks:
      - backend
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    mem_limit: 768m

  zabbix-agent2:
    image: zabbix/zabbix-agent2:alpine-7.0.29
    container_name: arcworks-monitoring-agent2
    restart: unless-stopped
    init: true
    user: "0:0"
    environment:
      ZBX_HOSTNAME: ARCWorks Docker
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_ACTIVE: zabbix-server:10051
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_ACTIVE_ALLOW: "true"
      TZ: Asia/Manila
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/agent2:/var/lib/zabbix
    depends_on:
      zabbix-server:
        condition: service_healthy
    networks:
      - monitoring
    mem_limit: 256m

networks:
  backend:
    name: arcworks-monitoring-backend
    internal: true
  monitoring:
    name: arcworks-monitoring-net

secrets:
  postgres_user:
    file: ./.secrets/postgres_user
  postgres_password:
    file: ./.secrets/postgres_password
