name: arcworks-resto
services:
  db:
    image: mariadb@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7
    restart: unless-stopped
    command:
      - --server-id=${DB_SERVER_ID:-1}
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-strict-mode=ON
      - --log-slave-updates=ON
      - --expire-logs-days=7
    environment:
      MARIADB_DATABASE: ${DB_NAME:-roms}
      MARIADB_USER: ${DB_USER:-roms}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  app:
    image: ${ROMS_IMAGE:-roms:local}
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: true
      DataProtection__KeysPath: /app/keys
      ConnectionStrings__DefaultConnection: Server=db;Port=3306;Database=${DB_NAME:-roms};User=${DB_USER:-roms};Password=${DB_PASSWORD};SslMode=Preferred
      Seed__AdminUsername: ${ADMIN_USERNAME:-admin}
      # Required only for first bootstrap; remove from .env after the admin exists.
      Seed__AdminPassword: ${ADMIN_PASSWORD:-}
      Seed__AdminDisplayName: ${ADMIN_DISPLAY_NAME:-ROMS Administrator}
      Ai__Enabled: ${AI_ENABLED:-false}
      Ai__CommandGatewayBaseUrl: http://command-gateway:8080/
      Ai__MaxConcurrentRequests: ${AI_MAX_CONCURRENT_REQUESTS:-2}
      Ai__RequestsPerMinute: ${AI_REQUESTS_PER_MINUTE:-6}
      AllowedHosts: ${ROMS_ALLOWED_HOSTS:-roms.arkworksph.online;app;localhost;127.0.0.1}
    volumes:
      - data-protection-keys:/app/keys
    # Cloudflare Tunnel publishes the application from this loopback-only port.
    ports: ["127.0.0.1:7070:8080"]
    networks: [backend, edge, command]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

  caddy:
    # Optional direct-HTTPS edge. Cloudflare Tunnel is the default production edge.
    profiles: ["direct-https"]
    image: caddy@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    restart: unless-stopped
    depends_on: [app]
    environment:
      ROMS_HOST: ${ROMS_HOST:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]

  monitor:
    image: twinproduction/gatus@sha256:19b064c8be229df4848475f5e07f7dcd19cabbe8c27ea7ed6ff0e5af8e2050b6
    restart: unless-stopped
    volumes:
      - ./deploy/gatus.yaml:/config/config.yaml:ro
      - monitor-data:/data
    networks: [backend, edge]

  cloudflared:
    profiles: ["edge-tunnel"]
    image: cloudflare/cloudflared@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflare_tunnel_token"]
    secrets: [cloudflare_tunnel_token]
    networks: [edge, portfolio]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0

  ollama:
    profiles: ["ai-lab"]
    image: ollama/ollama@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_KEEP_ALIVE: "2m"
    volumes:
      - ollama-models:/root/.ollama
    # Loopback publishing supports controlled local benchmarks. It is not
    # reachable from the LAN and must never be routed through Cloudflare.
    ports:
      - "127.0.0.1:11434:11434"
    # The benchmark network supplies the gateway Docker Desktop needs for the
    # loopback port and controlled model pulls. The application gateway remains
    # isolated on the separate inference network.
    networks: [inference, benchmark]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    # Defaults leave capacity for ROMS and MariaDB while allowing meaningful
    # CPU-only comparisons on the current 16-thread Docker Desktop host.
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-16g}
    cpus: ${OLLAMA_CPU_LIMIT:-12.0}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10

  command-gateway:
    profiles: ["ai-lab"]
    image: roms-command-gateway:local
    build:
      context: .
      dockerfile: src/Roms.CommandGateway/Dockerfile
    restart: unless-stopped
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Ollama__BaseUrl: http://ollama:11434/
      Ollama__Model: ${OLLAMA_MODEL:-qwen2.5:3b}
    # The gateway can reach the model but has no backend network, database
    # credentials, host port, project mount, or production execution path.
    networks: [command, inference]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0

volumes:
  mariadb-data:
  caddy-data:
  caddy-config:
  monitor-data:
  data-protection-keys:
  ollama-models:
    external: true
    name: ollama
secrets:
  cloudflare_tunnel_token:
    file: ./.secrets/cloudflare-tunnel-token
networks:
  backend: { internal: true }
  edge:
  command: { internal: true }
  inference: { internal: true }
  benchmark:
  portfolio:
    external: true
    name: arcworks-portfolio-net
