name: arcworks-resto
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command:
      - --server-id=${DB_SERVER_ID:-1}
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-strict-mode=ON
      - --log-slave-updates=ON
      - --expire-logs-days=7
    environment:
      MARIADB_DATABASE: ${DB_NAME:-roms}
      MARIADB_USER: ${DB_USER:-roms}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  app:
    image: ${ROMS_IMAGE:-roms:local}
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: true
      DataProtection__KeysPath: /app/keys
      ConnectionStrings__DefaultConnection: Server=db;Port=3306;Database=${DB_NAME:-roms};User=${DB_USER:-roms};Password=${DB_PASSWORD};SslMode=Preferred
      Seed__AdminUsername: ${ADMIN_USERNAME:-admin}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      Seed__AdminDisplayName: ${ADMIN_DISPLAY_NAME:-ROMS Administrator}
      Features__Inventory__Enabled: ${INVENTORY_ENABLED:-false}
    volumes:
      - data-protection-keys:/app/keys
    # Cloudflare Tunnel publishes the application from this loopback-only port.
    ports: ["127.0.0.1:7070:8080"]
    networks: [backend, edge]

  caddy:
    # Optional direct-HTTPS edge. Cloudflare Tunnel is the default production edge.
    profiles: ["direct-https"]
    image: caddy:2.10
    restart: unless-stopped
    depends_on: [app]
    environment:
      ROMS_HOST: ${ROMS_HOST:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]

  monitor:
    image: twinproduction/gatus:v5.24.3
    restart: unless-stopped
    volumes:
      - ./deploy/gatus.yaml:/config/config.yaml:ro
      - monitor-data:/data
    networks: [backend]

  ollama:
    profiles: ["ai-lab"]
    image: ollama/ollama@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_KEEP_ALIVE: "2m"
    volumes:
      - ollama-models:/root/.ollama
    # The model server is reachable only by services on the private inference
    # network. Never publish Ollama's unauthenticated API to the host or tunnel.
    networks: [inference]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 8g
    cpus: 4.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10

  command-gateway:
    profiles: ["ai-lab"]
    image: roms-command-gateway:local
    build:
      context: .
      dockerfile: src/Roms.CommandGateway/Dockerfile
    restart: unless-stopped
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Ollama__BaseUrl: http://ollama:11434/
      Ollama__Model: tinyllama:1.1b
    # The gateway can reach the model but has no backend network, database
    # credentials, host port, project mount, or production execution path.
    networks: [command, inference]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0

volumes:
  mariadb-data:
  caddy-data:
  caddy-config:
  monitor-data:
  data-protection-keys:
  ollama-models:
    external: true
    name: ollama
networks:
  backend: { internal: true }
  edge:
  command: { internal: true }
  inference: { internal: true }
